<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <!-- Page gradient -->
    <linearGradient id="pageBg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f0f2ff"/>
      <stop offset="45%"  stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <!-- Ambient blobs -->
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c7d2fe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ddd6fe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bfdbfe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base fill -->
  <rect width="1600" height="1000" fill="url(#pageBg)"/>

  <!-- Ambient blobs -->
  <ellipse cx="180"  cy="200"  rx="380" ry="320" fill="url(#blob1)"/>
  <ellipse cx="1420" cy="800"  rx="420" ry="340" fill="url(#blob2)"/>
  <ellipse cx="900"  cy="500"  rx="500" ry="400" fill="url(#blob3)" opacity="0.18"/>

  <!-- === SUBTLE DOT GRID (very faint) === -->
  <g opacity="0.045" fill="#6366f1">
    <!-- left column -->
    <circle cx="60"  cy="120" r="2.5"/> <circle cx="100" cy="120" r="2.5"/> <circle cx="140" cy="120" r="2.5"/>
    <circle cx="60"  cy="160" r="2.5"/> <circle cx="100" cy="160" r="2.5"/> <circle cx="140" cy="160" r="2.5"/>
    <circle cx="60"  cy="200" r="2.5"/> <circle cx="100" cy="200" r="2.5"/> <circle cx="140" cy="200" r="2.5"/>
    <circle cx="60"  cy="240" r="2.5"/> <circle cx="100" cy="240" r="2.5"/> <circle cx="140" cy="240" r="2.5"/>
    <circle cx="60"  cy="280" r="2.5"/> <circle cx="100" cy="280" r="2.5"/> <circle cx="140" cy="280" r="2.5"/>
    <!-- right column -->
    <circle cx="1460" cy="180" r="2.5"/> <circle cx="1500" cy="180" r="2.5"/> <circle cx="1540" cy="180" r="2.5"/>
    <circle cx="1460" cy="220" r="2.5"/> <circle cx="1500" cy="220" r="2.5"/> <circle cx="1540" cy="220" r="2.5"/>
    <circle cx="1460" cy="260" r="2.5"/> <circle cx="1500" cy="260" r="2.5"/> <circle cx="1540" cy="260" r="2.5"/>
    <circle cx="1460" cy="300" r="2.5"/> <circle cx="1500" cy="300" r="2.5"/> <circle cx="1540" cy="300" r="2.5"/>
    <!-- bottom left -->
    <circle cx="80"  cy="780" r="2.5"/> <circle cx="120" cy="780" r="2.5"/> <circle cx="160" cy="780" r="2.5"/>
    <circle cx="80"  cy="820" r="2.5"/> <circle cx="120" cy="820" r="2.5"/> <circle cx="160" cy="820" r="2.5"/>
    <circle cx="80"  cy="860" r="2.5"/> <circle cx="120" cy="860" r="2.5"/> <circle cx="160" cy="860" r="2.5"/>
    <!-- bottom right -->
    <circle cx="1440" cy="720" r="2.5"/> <circle cx="1480" cy="720" r="2.5"/> <circle cx="1520" cy="720" r="2.5"/>
    <circle cx="1440" cy="760" r="2.5"/> <circle cx="1480" cy="760" r="2.5"/> <circle cx="1520" cy="760" r="2.5"/>
    <circle cx="1440" cy="800" r="2.5"/> <circle cx="1480" cy="800" r="2.5"/> <circle cx="1520" cy="800" r="2.5"/>
  </g>

  <!-- === TOP-LEFT: Clipboard / checklist === -->
  <g opacity="0.075" transform="translate(50, 60)">
    <rect x="0" y="20" width="120" height="150" rx="10" stroke="#6366f1" stroke-width="2" fill="none"/>
    <rect x="36" y="10" width="48" height="22" rx="6" stroke="#6366f1" stroke-width="2" fill="none"/>
    <!-- rows -->
    <rect x="16" y="55"  width="16" height="16" rx="4" fill="#818cf8"/>
    <line x1="40" y1="63"  x2="98" y2="63"  stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="16" y="83"  width="16" height="16" rx="4" fill="#6366f1"/>
    <line x1="40" y1="91"  x2="90" y2="91"  stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- checked row -->
    <rect x="16" y="111" width="16" height="16" rx="4" fill="#a5b4fc"/>
    <polyline points="19,119 22,123 30,113" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="40" y1="119" x2="86" y2="119" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <rect x="16" y="139" width="16" height="16" rx="4" fill="#c7d2fe"/>
    <line x1="40" y1="147" x2="76" y2="147" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- === TOP-RIGHT: Calendar === -->
  <g opacity="0.07" transform="translate(1420, 50)">
    <rect x="0" y="0" width="130" height="120" rx="12" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <line x1="0" y1="34" x2="130" y2="34" stroke="#7c3aed" stroke-width="2"/>
    <rect x="20" y="12" width="12" height="20" rx="3" fill="#7c3aed"/>
    <rect x="98" y="12" width="12" height="20" rx="3" fill="#7c3aed"/>
    <!-- grid -->
    <circle cx="24"  cy="57" r="6" fill="#a78bfa"/>
    <circle cx="48"  cy="57" r="6" fill="#a78bfa"/>
    <circle cx="72"  cy="57" r="6" fill="#a78bfa"/>
    <circle cx="96"  cy="57" r="9" fill="#6366f1"/>
    <circle cx="24"  cy="82" r="6" fill="#c4b5fd"/>
    <circle cx="48"  cy="82" r="6" fill="#c4b5fd"/>
    <circle cx="72"  cy="82" r="6" fill="#c4b5fd"/>
    <circle cx="96"  cy="82" r="6" fill="#c4b5fd"/>
    <circle cx="24"  cy="107" r="6" fill="#ede9fe"/>
    <circle cx="48"  cy="107" r="6" fill="#ede9fe"/>
  </g>

  <!-- === BOTTOM-LEFT: Floating task cards === -->
  <g opacity="0.065" transform="translate(36, 680)">
    <rect x="0"   y="0"  width="140" height="44" rx="10" fill="#6366f1"/>
    <line x1="16" y1="16" x2="90"  y2="16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="28" x2="68"  y2="28" stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.6"/>
    <rect x="0"   y="56" width="110" height="44" rx="10" fill="#818cf8"/>
    <line x1="16" y1="72" x2="76"  y2="72" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="84" x2="55"  y2="84" stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.6"/>
    <rect x="0"   y="112" width="124" height="44" rx="10" fill="#a5b4fc"/>
    <line x1="16" y1="128" x2="84"  y2="128" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="140" x2="60"  y2="140" stroke="white" stroke-width="2"   stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- === BOTTOM-RIGHT: Check circles === -->
  <g opacity="0.065" transform="translate(1440, 760)">
    <circle cx="24" cy="24" r="22" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
    <polyline points="13,24 20,32 35,16" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="80" cy="24" r="22" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
    <polyline points="69,24 76,32 91,16" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="136" cy="24" r="22" stroke="#c4b5fd" stroke-width="2.5" fill="none"/>
    <polyline points="125,24 132,32 147,16" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === CENTER-LEFT: Pencil decoration === -->
  <g opacity="0.05" transform="translate(48, 430)">
    <path d="M0,70 L48,22 L66,40 L18,88 Z" stroke="#6366f1" stroke-width="2" fill="none"/>
    <path d="M48,22 L57,13 L66,4 L74,12 L66,20 L57,29 Z" stroke="#6366f1" stroke-width="2" fill="none"/>
    <line x1="0" y1="70" x2="12" y2="90" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="90" x2="0" y2="95" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="95" x2="0" y2="70" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- === CENTER-RIGHT: Star / sparkle === -->
  <g opacity="0.06" transform="translate(1510, 450)">
    <path d="M20,0 L24,14 L38,14 L27,22 L31,36 L20,28 L9,36 L13,22 L2,14 L16,14 Z" stroke="#7c3aed" stroke-width="1.5" fill="none"/>
    <circle cx="60" cy="60" r="8" stroke="#a78bfa" stroke-width="1.5" fill="none"/>
    <line x1="60" y1="48" x2="60" y2="72" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="60" x2="72" y2="60" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
