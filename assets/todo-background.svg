<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <!-- Soft gradient base -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="50%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Soft circle blur -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Soft ambient glows -->
  <ellipse cx="200" cy="180" rx="320" ry="280" fill="url(#glow1)" opacity="0.6"/>
  <ellipse cx="1260" cy="700" rx="360" ry="300" fill="url(#glow2)" opacity="0.5"/>
  <ellipse cx="720" cy="450" rx="400" ry="350" fill="url(#glow1)" opacity="0.2"/>

  <!-- === TOP-LEFT: Decorative mini task list === -->
  <g opacity="0.09" transform="translate(48, 60)">
    <!-- clipboard outline -->
    <rect x="0" y="18" width="110" height="130" rx="8" stroke="#6366f1" stroke-width="2" fill="none"/>
    <rect x="32" y="10" width="46" height="18" rx="5" stroke="#6366f1" stroke-width="2" fill="none"/>
    <!-- rows -->
    <rect x="14" y="48" width="14" height="14" rx="3" fill="#6366f1"/>
    <line x1="34" y1="55" x2="90" y2="55" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="14" y="74" width="14" height="14" rx="3" fill="#818cf8"/>
    <line x1="34" y1="81" x2="84" y2="81" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- checked row with tick -->
    <rect x="14" y="100" width="14" height="14" rx="3" fill="#a5b4fc"/>
    <polyline points="16,107 19,111 26,104" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="34" y1="107" x2="78" y2="107" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- === TOP-RIGHT: Calendar element === -->
  <g opacity="0.08" transform="translate(1290, 40)">
    <rect x="0" y="0" width="110" height="100" rx="10" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <line x1="0" y1="28" x2="110" y2="28" stroke="#7c3aed" stroke-width="2"/>
    <rect x="16" y="10" width="10" height="16" rx="2" fill="#7c3aed"/>
    <rect x="84" y="10" width="10" height="16" rx="2" fill="#7c3aed"/>
    <!-- day grid -->
    <circle cx="20" cy="48" r="5" fill="#a78bfa"/>
    <circle cx="40" cy="48" r="5" fill="#a78bfa"/>
    <circle cx="60" cy="48" r="5" fill="#a78bfa"/>
    <circle cx="80" cy="48" r="7" fill="#6366f1"/>
    <circle cx="20" cy="68" r="5" fill="#c4b5fd"/>
    <circle cx="40" cy="68" r="5" fill="#c4b5fd"/>
    <circle cx="60" cy="68" r="5" fill="#c4b5fd"/>
    <circle cx="80" cy="68" r="5" fill="#c4b5fd"/>
    <circle cx="20" cy="86" r="5" fill="#ddd6fe"/>
    <circle cx="40" cy="86" r="5" fill="#ddd6fe"/>
  </g>

  <!-- === BOTTOM-LEFT: Checkmarks === -->
  <g opacity="0.07" transform="translate(60, 730)">
    <circle cx="16" cy="16" r="14" stroke="#6366f1" stroke-width="2" fill="none"/>
    <polyline points="8,16 13,22 24,10" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="60" cy="16" r="14" stroke="#818cf8" stroke-width="2" fill="none"/>
    <polyline points="52,16 57,22 68,10" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="104" cy="16" r="14" stroke="#a5b4fc" stroke-width="2" fill="none"/>
    <polyline points="96,16 101,22 112,10" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- === BOTTOM-RIGHT: Pencil/edit element === -->
  <g opacity="0.07" transform="translate(1330, 800)">
    <path d="M0 60 L40 20 L55 35 L15 75 Z" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M40 20 L48 12 L55 5 L62 12 L55 19 L47 27 Z" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <line x1="0" y1="60" x2="10" y2="75" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="75" x2="0" y2="80" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="0" y2="60" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- === Subtle dot grid pattern (center) === -->
  <g opacity="0.035">
    <!-- row 1 -->
    <circle cx="120" cy="300" r="2" fill="#6366f1"/>
    <circle cx="160" cy="300" r="2" fill="#6366f1"/>
    <circle cx="200" cy="300" r="2" fill="#6366f1"/>
    <circle cx="120" cy="340" r="2" fill="#6366f1"/>
    <circle cx="160" cy="340" r="2" fill="#6366f1"/>
    <circle cx="200" cy="340" r="2" fill="#6366f1"/>
    <circle cx="120" cy="380" r="2" fill="#6366f1"/>
    <circle cx="160" cy="380" r="2" fill="#6366f1"/>
    <circle cx="200" cy="380" r="2" fill="#6366f1"/>
    <!-- right side -->
    <circle cx="1240" cy="260" r="2" fill="#7c3aed"/>
    <circle cx="1280" cy="260" r="2" fill="#7c3aed"/>
    <circle cx="1320" cy="260" r="2" fill="#7c3aed"/>
    <circle cx="1240" cy="300" r="2" fill="#7c3aed"/>
    <circle cx="1280" cy="300" r="2" fill="#7c3aed"/>
    <circle cx="1320" cy="300" r="2" fill="#7c3aed"/>
    <circle cx="1240" cy="340" r="2" fill="#7c3aed"/>
    <circle cx="1280" cy="340" r="2" fill="#7c3aed"/>
    <circle cx="1320" cy="340" r="2" fill="#7c3aed"/>
  </g>

  <!-- === Floating task pill shapes (decorative) === -->
  <g opacity="0.06">
    <rect x="55" y="460" width="90" height="20" rx="10" fill="#6366f1"/>
    <rect x="55" y="490" width="66" height="20" rx="10" fill="#a5b4fc"/>
    <rect x="55" y="520" width="80" height="20" rx="10" fill="#818cf8"/>
  </g>
  <g opacity="0.05">
    <rect x="1295" y="420" width="90" height="20" rx="10" fill="#7c3aed"/>
    <rect x="1295" y="450" width="70" height="20" rx="10" fill="#a78bfa"/>
    <rect x="1295" y="480" width="82" height="20" rx="10" fill="#c4b5fd"/>
  </g>
</svg>
